server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        return 204;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Vite puts content-hashed files in /assets, so they never change.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client-side routes (TanStack Router) all load index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
